# alembic.ini — Postgres migration runner config.
#
# Used by `alembic upgrade head` (applied during deploy, see
# docs/postgres-backend-deploy.md) and by the in-app migration runner
# documented in docs/postgres-backend-design/D-connection-mgmt.md §7.
#
# The DSN is read from POSTGRES_DSN at runtime (see alembic/env.py); the
# sqlalchemy.url here is a placeholder so `alembic --help` works without
# the env var set.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
output_encoding = utf-8

# Placeholder. Real DSN is loaded from $POSTGRES_DSN in alembic/env.py.
sqlalchemy.url = postgresql+psycopg://localhost/mcp_registry

# Don't auto-version-format filenames; we hand-craft them.
# file_template defaults are fine for hand-written revisions.

[post_write_hooks]
# No formatters configured — hand-written SQL revisions only.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
